<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de votaciones · La Nación</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{margin:0;background:#eef2f7;color:#0f172a;font-family:Arial,Helvetica,sans-serif}
  .lnv-app{width:100%;min-width:1180px;padding:20px 24px 36px}
  .lnv-toolbar{width:1120px;margin:0 auto 14px}
  .lnv-preview-shell{width:1120px;margin:0 auto}
  .lnv-preview-viewport{position:relative;width:1120px;background:#dbe3ec;border:1px solid #cbd5e1;border-radius:16px;overflow:hidden}
  .lnv-stage{position:absolute;left:0;top:0;transform-origin:top left;overflow:hidden;background:#031d33;color:white}
  .lnv-watermark-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .lnv-watermark-item{position:absolute;width:190px;height:auto;filter:brightness(0) invert(1);opacity:.065;transform:rotate(-18deg);user-select:none}
  .lnv-stage-content{position:relative;z-index:1;height:100%;box-sizing:border-box}
  .lnv-logo-main{filter:brightness(0) invert(1)}
  .lnv-vote-ring{border-style:solid}
  .lnv-favor{border-color:#16a34a}
  .lnv-contra{border-color:#dc2626}
  .lnv-no{border-color:#94a3b8}
  .lnv-ausente{border-color:#e2e8f0}
  .lnv-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lnv-seat-card{text-align:center;min-width:0}
  .lnv-seat-photo{margin:0 auto;border-radius:9999px;background:white;padding:3px;overflow:hidden}
  .lnv-seat-photo img{width:100%;height:100%;object-fit:cover;border-radius:9999px}
  .lnv-seat-name{font-weight:800;line-height:1.02;color:white}
  .lnv-seat-party{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:4px;
    padding:2px 6px;
    border-radius:9999px;
    font-weight:900;
    letter-spacing:.02em;
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 1px 2px rgba(0,0,0,.18);
  }
  /* Horizontal: composición inspirada en la lógica espacial de Delfino */
  .lnv-h-layout{height:100%;display:grid;grid-template-rows:88px 1fr 1fr;gap:4px}
  .lnv-h-top{display:flex;justify-content:center;align-items:start;gap:16px}
  .lnv-h-half{display:grid;grid-template-columns:1fr 320px 1fr;gap:10px;align-items:center;min-height:0}
  .lnv-h-left,.lnv-h-right{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;align-content:center}
  .lnv-h-left{padding-right:3px}.lnv-h-right{padding-left:3px}
  .lnv-h-bottom{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px 2px;align-items:start}
  .lnv-h-layout .lnv-seat-card{min-width:0}
  .lnv-h-layout .lnv-seat-name{max-width:76px;margin-left:auto;margin-right:auto}

  /* Vertical: composición tipo Canva de La Nación */
  .lnv-v-layout{height:100%;display:grid;grid-template-rows:100px 360px 1fr;gap:12px}
  .lnv-v-top{display:flex;justify-content:center;gap:22px;align-items:start}
  .lnv-v-upper{display:grid;grid-template-columns:1fr 330px 1fr;gap:12px;align-items:center}
  .lnv-v-side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 4px;align-content:center}
  .lnv-v-bottom{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px 4px;align-content:start}
  .lnv-v-layout .lnv-seat-name{max-width:96px;margin-left:auto;margin-right:auto}

  @media print {
    html,body{margin:0!important;padding:0!important;background:white!important}
    .lnv-toolbar,.lnv-preview-shell>div:not(.lnv-preview-viewport){display:none!important}
    .lnv-app,.lnv-preview-shell,.lnv-preview-viewport{margin:0!important;padding:0!important;width:auto!important;min-width:0!important;border:0!important;background:white!important}
    .lnv-preview-viewport{overflow:visible!important;height:auto!important}
    .lnv-stage{position:static!important;transform:none!important;box-shadow:none!important;border-radius:0!important}
  }
  .lnv-summary{background:rgba(3,29,51,.34);color:white;border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.10);box-shadow:none;backdrop-filter:blur(1.5px)}
  .lnv-summary-title{font-weight:900;line-height:1.02;color:white}
  .lnv-summary-desc{color:rgba(255,255,255,.84);line-height:1.28}
  .lnv-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lnv-stat{border-radius:16px;padding:12px}
  .lnv-error{display:none}
  .lnv-error.lnv-show{display:block}
  .lnv-focus:focus-visible{outline:3px solid rgba(17,73,125,.28);outline-offset:2px}
</style>
</head>
<body>
<div id="lnv-app" class="lnv-app">
  <div class="lnv-toolbar rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex items-center justify-between gap-4">
      <div>
        <div class="text-xs font-bold uppercase tracking-[.14em] text-slate-500">Herramienta interna</div>
        <div class="text-lg font-black text-slate-950">Generador de votaciones · La Nación</div>
      </div>
      <div class="flex items-center gap-2">
        <button id="lnv-refresh" type="button" class="lnv-focus rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700">Actualizar datos</button>
        <button id="lnv-print" type="button" class="lnv-focus rounded-full border border-[#11497d] bg-[#11497d] px-4 py-2 text-sm font-bold text-white">Guardar PDF</button>
        <button id="lnv-download" type="button" class="lnv-focus rounded-full border border-slate-300 bg-slate-100 px-4 py-2 text-sm font-bold text-slate-400" title="Para exportar PNG con fotos necesitamos alojar las imágenes en el mismo dominio" disabled>PNG (próximamente)</button>
      </div>
    </div>
    <div class="mt-4 flex flex-wrap gap-2" aria-label="Tamaño de salida">
      <button data-preset="facebook" class="lnv-preset lnv-focus rounded-full border border-[#11497d] bg-[#11497d] px-4 py-2 text-sm font-bold text-white">Facebook · 1200×630</button>
      <button data-preset="twitter" class="lnv-preset lnv-focus rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700">X/Twitter · 1600×900</button>
      <button data-preset="instagram" class="lnv-preset lnv-focus rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700">Instagram · 1080×1350</button>
      <button data-preset="stories" class="lnv-preset lnv-focus rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700">Stories · 1080×1920</button>
    </div>
    <div id="lnv-status" class="mt-3 text-xs text-slate-500">Cargando datos…</div>
  </div>

  <div class="lnv-preview-shell">
    <div id="lnv-preview-viewport" class="lnv-preview-viewport">

let lnvPreset="facebook";
let lnvData=null;

function lnvEsc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function lnvCSV(text){
  const rows=[];let row=[],field="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(q){
      if(c==='"'&&n==='"'){field+='"';i++;}
      else if(c==='"')q=false;else field+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(field);field="";}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";}
      else if(c!=='\r')field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  const headers=(rows.shift()||[]).map(x=>x.trim());
  return rows.filter(r=>r.some(v=>String(v).trim()!=="")).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??"").trim()])));
}
async function lnvFetch(url){
  const sep=url.includes("?")?"&":"?";
  const res=await fetch(`${url}${sep}lnv_ts=${Date.now()}`,{cache:"no-store"});
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  return lnvCSV(await res.text());
}
function lnvNormalizeVote(v){
  const s=String(v||"").trim();
  if(LNV_VOTE[s])return s;
  return s||"Ausente";
}
function lnvPartyStyle(code){
  const p=LNV_PARTIES[code];
  if(!p)return "background:#475569;color:#fff";
  const colors=p.colors||["#475569"];
  let bg=colors[0];
  if(colors.length===2) bg=`linear-gradient(90deg,${colors[0]} 0 50%,${colors[1]} 50% 100%)`;
  if(colors.length===3) bg=`linear-gradient(90deg,${colors[0]} 0 33.33%,${colors[1]} 33.33% 66.66%,${colors[2]} 66.66% 100%)`;
  return `background:${bg};color:${p.text||"#fff"}`;
}

function lnvCounts(rows){
  const c={favor:0,contra:0,no:0,ausente:0};
  rows.forEach(r=>{
    const v=lnvNormalizeVote(r.Voto);
    if(v==="A favor")c.favor++;
    else if(v==="En contra")c.contra++;
    else if(v==="Presente, no votó")c.no++;
    else c.ausente++;
  });
  return c;
}
function lnvSeatCard(r,size){
  if(!r)return `<div></div>`;
  const vote=lnvNormalizeVote(r.Voto);
  const meta=LNV_VOTE[vote]||LNV_VOTE["Ausente"];
  return `<div class="lnv-seat-card">
    <div class="lnv-seat-photo lnv-vote-ring ${meta.cls}" style="width:${size.photo}px;height:${size.photo}px;border-width:${size.ring}px">
      ${r.Foto?`<img src="${lnvEsc(r.Foto)}" alt="" onerror="this.style.display='none'">`:""}
    </div>
    <div class="lnv-seat-name lnv-name" style="font-size:${size.name}px;margin-top:${size.gap}px">${lnvEsc(r.Nombre)}</div>
    <div class="lnv-seat-party" style="font-size:${size.party}px;${lnvPartyStyle(r.Partido)}">${lnvEsc(r.Partido)}</div>
  </div>`;
}
function lnvSummary(ficha,rows,mode){
  const c=lnvCounts(rows),presentes=c.favor+c.contra+c.no;
  const resultado=(ficha.Resultado||"").trim();
  const resultColor=/aprob/i.test(resultado)?"#15803d":/rechaz|reprob/i.test(resultado)?"#be123c":"#0f172a";
  const vertical=mode==="vertical";
  const facebook=lnvPreset==="facebook";
  return `<div class="lnv-summary">
    <div style="font-size:${vertical?18:(facebook?10:13)}px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.7)">${lnvEsc(ficha.Debate||"")}${ficha.Expediente?` · Exp. ${lnvEsc(ficha.Expediente)}`:""}</div>
    <h1 class="lnv-summary-title" style="font-size:${vertical?36:(facebook?22:28)}px;margin-top:8px">${lnvEsc(ficha.Proyecto||"Votación legislativa")}</h1>
    ${ficha.Descripción?`<p class="lnv-summary-desc" style="font-size:${vertical?20:(facebook?12:16)}px;margin-top:8px">${lnvEsc(ficha.Descripción)}</p>`:""}
    <div class="lnv-stat-grid" style="margin-top:${vertical?18:(facebook?10:14)}px">
      <div class="lnv-stat" style="background:rgba(22,163,74,.15);border:1px solid rgba(34,197,94,.22)"><div style="font-size:${vertical?34:(facebook?22:28)}px;font-weight:900;color:#15803d">${c.favor}</div><div style="font-size:${vertical?13:(facebook?9:11)}px;font-weight:900;text-transform:uppercase;color:#166534">A favor</div></div>
      <div class="lnv-stat" style="background:rgba(220,38,38,.14);border:1px solid rgba(244,63,94,.22)"><div style="font-size:${vertical?34:(facebook?22:28)}px;font-weight:900;color:#be123c">${c.contra}</div><div style="font-size:${vertical?13:(facebook?9:11)}px;font-weight:900;text-transform:uppercase;color:#9f1239">En contra</div></div>
      <div class="lnv-stat" style="background:rgba(148,163,184,.14);border:1px solid rgba(203,213,225,.18)"><div style="font-size:${vertical?34:(facebook?22:28)}px;font-weight:900;color:#475569">${c.no}</div><div style="font-size:${vertical?13:(facebook?9:11)}px;font-weight:900;text-transform:uppercase;color:#475569">Presente, no votó</div></div>
      <div class="lnv-stat" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)"><div style="font-size:${vertical?34:(facebook?22:28)}px;font-weight:900;color:#64748b">${c.ausente}</div><div style="font-size:${vertical?13:(facebook?9:11)}px;font-weight:900;text-transform:uppercase;color:#64748b">Ausentes</div></div>
    </div>
    <div style="margin-top:${vertical?18:13}px;font-size:${vertical?15:(facebook?10:12)}px;font-weight:800;color:rgba(255,255,255,.72)">${presentes} presentes</div>
    ${resultado?`<div style="margin-top:4px;font-size:${vertical?34:(facebook?23:28)}px;font-weight:900;color:${resultColor}">${lnvEsc(resultado).toUpperCase()}</div>`:""}
  </div>`;
}
function lnvRenderGraphic(){
  if(!lnvData)return;
  const preset=LNV_PRESETS[lnvPreset],ficha=lnvData.ficha[0]||{};
  const rows=[...lnvData.votacion].sort((a,b)=>(Number(a.Orden)||999)-(Number(b.Orden)||999));
  const byOrder=new Map(rows.map(r=>[Number(r.Orden),r]));
  const card=(n,size)=>lnvSeatCard(byOrder.get(n),size);

  if(preset.orientation==="horizontal"){
    const size=lnvPreset==="facebook"
      ? {photo:34,ring:3,name:8,party:7,gap:2}
      : {photo:42,ring:4,name:10,party:8,gap:2};

    // Lógica Delfino: 3 arriba, dos bloques laterales alrededor del centro,
    // y el resto en dos franjas inferiores compactas.
    const top=[1,2,3].map(n=>card(n,size)).join("");
    const left=Array.from({length:14},(_,i)=>card(i+4,size)).join("");
    const right=Array.from({length:14},(_,i)=>card(i+18,size)).join("");
    const bottom1=Array.from({length:13},(_,i)=>card(i+32,size)).join("");
    const bottom2=Array.from({length:13},(_,i)=>card(i+45,size)).join("");

    document.getElementById("lnv-graphic").innerHTML=`
      <div class="lnv-h-layout">
        <div class="lnv-h-top">${top}</div>
        <div class="lnv-h-half">
          <div class="lnv-h-left">${left}</div>
          <div>${lnvSummary(ficha,rows,preset.orientation)}</div>
          <div class="lnv-h-right">${right}</div>
        </div>
        <div>
          <div class="lnv-h-bottom" style="grid-template-columns:repeat(13,minmax(0,1fr));margin-bottom:4px">${bottom1}</div>
          <div class="lnv-h-bottom" style="grid-template-columns:repeat(13,minmax(0,1fr))">${bottom2}</div>
        </div>
      </div>`;
  }else{
    const size=lnvPreset==="stories"
      ? {photo:50,ring:4,name:11,party:9,gap:3}
      : {photo:46,ring:4,name:10,party:8,gap:3};

    // Vertical: orden compacto tipo Canva de La Nación.
    const top=[1,2,3].map(n=>card(n,size)).join("");
    const left=Array.from({length:14},(_,i)=>card(i+4,size)).join("");
    const right=Array.from({length:14},(_,i)=>card(i+18,size)).join("");
    const bottom=Array.from({length:26},(_,i)=>card(i+32,size)).join("");

    document.getElementById("lnv-graphic").innerHTML=`
      <div class="lnv-v-layout">
        <div class="lnv-v-top">${top}</div>
        <div class="lnv-v-upper">
          <div class="lnv-v-side">${left}</div>
          <div>${lnvSummary(ficha,rows,preset.orientation)}</div>
          <div class="lnv-v-side">${right}</div>
        </div>
        <div class="lnv-v-bottom">${bottom}</div>
      </div>`;
  }
  document.getElementById("lnv-kicker").textContent=[ficha.Debate,ficha.Expediente?`Exp. ${ficha.Expediente}`:""].filter(Boolean).join(" · ");
}
function lnvBuildWatermark(width,height){
  const layer=document.getElementById("lnv-watermark-layer");
  layer.innerHTML="";
  const tileW=300,tileH=210,logoW=170;
  let row=0;
  for(let y=-80;y<height+100;y+=tileH){
    const offset=row%2?150:0;
    for(let x=-120+offset;x<width+150;x+=tileW){
      const img=document.createElement("img");
      img.src=LNV_LOGO;
      img.alt="";
      img.className="lnv-watermark-item";
      img.style.width=logoW+"px";
      img.style.left=x+"px";
      img.style.top=y+"px";
      layer.appendChild(img);
    }
    row++;
  }
}
function lnvApplyPreset(name){
  lnvPreset=name;
  const p=LNV_PRESETS[name],stage=document.getElementById("lnv-stage"),content=stage.querySelector(".lnv-stage-content");
  stage.style.width=p.width+"px";
  stage.style.height=p.height+"px";
  content.style.padding=p.orientation==="horizontal"?"30px 34px 28px":"44px 42px 38px";
  const header=document.getElementById("lnv-stage-header");
  header.style.height=p.orientation==="horizontal"?"34px":"48px";
  header.querySelector("img").style.width=p.orientation==="horizontal"?"190px":"230px";
  document.getElementById("lnv-kicker").style.fontSize=p.orientation==="horizontal"?"13px":"17px";
  const graphic=document.getElementById("lnv-graphic");
  graphic.style.marginTop=p.orientation==="horizontal"?"6px":"12px";
  graphic.style.height=p.orientation==="horizontal"
    ? (p.height-92)+"px"
    : (p.height-130)+"px";
  let pageStyle=document.getElementById("lnv-page-style");
  if(!pageStyle){pageStyle=document.createElement("style");pageStyle.id="lnv-page-style";document.head.appendChild(pageStyle);}
  pageStyle.textContent=`@page { size: ${p.width/96}in ${p.height/96}in; margin:0; }`;
  const footer=document.getElementById("lnv-stage-footer");
  footer.style.left=content.style.paddingLeft||"34px";
  footer.style.right=content.style.paddingRight||"34px";
  footer.style.bottom=p.orientation==="horizontal"?"18px":"24px";
  footer.style.paddingTop="8px";
  footer.style.fontSize=p.orientation==="horizontal"?"10px":"14px";
  lnvBuildWatermark(p.width,p.height);
  lnvRenderGraphic();
  document.querySelectorAll(".lnv-preset").forEach(b=>{
    const on=b.dataset.preset===name;
    b.classList.toggle("bg-[#11497d]",on);b.classList.toggle("text-white",on);b.classList.toggle("border-[#11497d]",on);
    b.classList.toggle("bg-white",!on);b.classList.toggle("text-slate-700",!on);b.classList.toggle("border-slate-300",!on);
  });
  requestAnimationFrame(lnvFitPreview);
}
function lnvFitPreview(){
  const p=LNV_PRESETS[lnvPreset],viewport=document.getElementById("lnv-preview-viewport"),stage=document.getElementById("lnv-stage");
  const maxW=1120,maxH=760;
  const scale=Math.min(maxW/p.width,maxH/p.height);
  stage.style.transform=`scale(${scale})`;
  viewport.style.height=(p.height*scale)+"px";
}
async function lnvLoad(){
  const [ficha,votacion]=await Promise.all([lnvFetch(LNV_SOURCES.ficha),lnvFetch(LNV_SOURCES.votacion)]);
  if(!votacion.length)throw new Error("La hoja Votacion no devolvió filas.");
  lnvData={ficha,votacion};
  lnvRenderGraphic();
  document.getElementById("lnv-status").textContent=`Datos actualizados · ${votacion.length} diputados · ${new Date().toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"})}`;
}
async function lnvRefresh(){
  const err=document.getElementById("lnv-error");err.classList.remove("lnv-show");
  document.getElementById("lnv-status").textContent="Actualizando datos…";
  try{await lnvLoad();}
  catch(e){console.error(e);err.textContent="No fue posible cargar Ficha o Votacion desde Google Sheets.";err.classList.add("lnv-show");document.getElementById("lnv-status").textContent="Error al actualizar";}
}
function lnvPrint(){
  const stage=document.getElementById("lnv-stage");
  const old=stage.style.transform;
  stage.style.transform="none";
  window.print();
  setTimeout(()=>{stage.style.transform=old;},300);
}
document.querySelectorAll(".lnv-preset").forEach(b=>b.addEventListener("click",()=>lnvApplyPreset(b.dataset.preset)));
document.getElementById("lnv-refresh").addEventListener("click",lnvRefresh);
document.getElementById("lnv-print").addEventListener("click",lnvPrint);
lnvApplyPreset("facebook");
lnvRefresh();
</script>
</body>
