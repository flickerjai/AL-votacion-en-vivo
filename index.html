const LNV_VOTE={
  "A favor":{color:"#16a34a",label:"A favor"},
  "En contra":{color:"#dc2626",label:"En contra"},
  "Presente, no votó":{color:"#94a3b8",label:"Presente, no votó"},
  "Ausente":{color:"#cbd5e1",label:"Ausente"},
  "Ausente en la sesión":{color:"#cbd5e1",label:"Ausente"}
};
const LNV_PARTY={
  PPSO:{bg:"#03a4b6",fg:"#fff"},
  PLN:{bg:"#33903f",fg:"#fff"},
  PFA:{bg:"#fede29",fg:"#000"},
  PUSC:{bg:"#052bbc",fg:"#fff"},
  CAC:{bg:"#14928a",fg:"#fff"}
};
let lnvData=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function csv(text){
  const rows=[];let row=[],field="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
    if(q){if(c==='"'&&n==='"'){field+='"';i++;}else if(c==='"')q=false;else field+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(field);field="";}else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";}else if(c!=='\r')field+=c;}
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  const h=(rows.shift()||[]).map(x=>x.trim());
  return rows.filter(r=>r.some(v=>String(v).trim()!=="")).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??"").trim()])));
}
async function getCsv(url){
  const sep=url.includes("?")?"&":"?";
  const r=await fetch(`${url}${sep}lnv_ts=${Date.now()}`,{cache:"no-store"});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return csv(await r.text());
}
function voteMeta(v){return LNV_VOTE[v]||LNV_VOTE["Ausente"];}
function initials(name){return String(name||"").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();}
function nameLines(name){
  const words=String(name||"").split(/\s+/);
  if(words.length<=2)return [words.join(" ")];
  let a="",b="";
  for(const w of words){
    if((a+" "+w).trim().length<=15 && !b)a=(a+" "+w).trim();
    else b=(b+" "+w).trim();
  }
  if(!b)return [a];
  return [a,b.length>18?b.slice(0,17)+"…":b];
}
function counts(rows){
  const c={favor:0,contra:0,no:0,ausente:0};
  for(const r of rows){if(r.Voto==="A favor")c.favor++;else if(r.Voto==="En contra")c.contra++;else if(r.Voto==="Presente, no votó")c.no++;else c.ausente++;}
  return c;
}
function personSvg(r){
  const pos=LNV_COORDS[r.Nombre];
  if(!pos)return "";
  const [x,y]=pos, vm=voteMeta(r.Voto), p=LNV_PARTY[r.Partido]||{bg:"#64748b",fg:"#fff"};
  const lines=nameLines(r.Nombre);
  const clipId="clip-"+Math.random().toString(36).slice(2);
  return `
    <g transform="translate(${x} ${y})">
      <defs><clipPath id="${clipId}"><circle cx="0" cy="-10" r="22"/></clipPath></defs>
      <circle cx="0" cy="-10" r="26" fill="${vm.color}"/>
      
      ${r.Foto?`<image href="${esc(r.Foto)}" x="-22" y="-32" width="44" height="44" preserveAspectRatio="xMidYMid slice" clip-path="url(#${clipId})"/>`:
      `<text x="0" y="-6" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">${initials(r.Nombre)}</text>`}
      <text x="0" y="25" text-anchor="middle" font-size="7.2" font-weight="700" fill="#fff">
        <tspan x="0" dy="0">${esc(lines[0])}</tspan>
        ${lines[1]?`<tspan x="0" dy="8">${esc(lines[1])}</tspan>`:""}
      </text>
      <rect x="-17" y="${lines[1]?36:29}" width="34" height="10" rx="5" fill="${p.bg}"/>
      <text x="0" y="${lines[1]?43.5:36.5}" text-anchor="middle" font-size="6.4" font-weight="800" fill="${p.fg}">${esc(r.Partido)}</text>
    </g>`;
}
function watermarkSvg(){
  let s="";
  const xs=[180,480,780,1080], ys=[215,405,600];
  for(let j=0;j<ys.length;j++)for(let i=0;i<xs.length;i++){
    s+=`<image href="${LNV_LOGO}" x="${xs[i]-70}" y="${ys[j]-18}" width="140" opacity=".045" transform="rotate(-22 ${xs[i]} ${ys[j]})" style="filter:brightness(0) invert(1)"/>`;
  }
  return s;
}
function render(){
  if(!lnvData)return;
  const ficha=lnvData.ficha[0]||{}, rows=lnvData.votacion, c=counts(rows), presentes=c.favor+c.contra+c.no;
  const result=(ficha.Resultado||"").toUpperCase();
  const resultColor=/APROB/.test(result)?"#22c55e":/RECHAZ|REPROB/.test(result)?"#ef4444":"#fff";
  const people=rows.map(personSvg).join("");
  const project=esc(ficha.Proyecto||"Votación legislativa");
  const desc=esc(ficha.Descripción||"");
  const kicker=[ficha.Debate,ficha.Expediente?`Exp. ${ficha.Expediente}`:""].filter(Boolean).join(" · ");
  const svg=`<svg id="lnv-svg" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
    <rect width="1200" height="630" fill="#031d33"/>
    ${watermarkSvg()}
    <image href="${LNV_LOGO}" x="24" y="22" width="125" style="filter:brightness(0) invert(1)"/>
    <g>${people}</g>
    <g>
      <!-- Bloque editorial izquierdo: alineado con Álvaro / Nogui -->
      <text x="225" y="265" font-size="11.5" font-weight="800" letter-spacing="1.1" fill="#cbd5e1">${esc(kicker.toUpperCase())}</text>

      <foreignObject x="225" y="278" width="540" height="62">
        <div xmlns="http://www.w3.org/1999/xhtml"
          style="font:900 24px/1.06 Arial,sans-serif;color:#fff;max-height:54px;overflow:hidden;">
          ${project}
        </div>
      </foreignObject>

      <foreignObject x="225" y="326" width="540" height="72">
        <div xmlns="http://www.w3.org/1999/xhtml"
          style="font:14px/1.34 Arial,sans-serif;color:rgba(255,255,255,.86);max-height:68px;overflow:hidden;">
          ${desc}
        </div>
      </foreignObject>

      <!-- Resumen a la derecha: alineado con José María Villalta -->
      <text x="818" y="265" font-size="13" font-weight="800" fill="#22c55e">${c.favor} a favor</text>
      <text x="818" y="291" font-size="13" font-weight="800" fill="#ef4444">${c.contra} en contra</text>
      <text x="818" y="317" font-size="13" font-weight="800" fill="#cbd5e1">${c.no} presente, no votó</text>
      <text x="818" y="343" font-size="13" font-weight="800" fill="#94a3b8">${c.ausente} ausentes</text>

      <text x="965" y="265" font-size="11.5" font-weight="700" fill="#94a3b8">${presentes} presentes</text>
      <text x="965" y="318" font-size="27" font-weight="900" fill="${resultColor}">${esc(result)}</text>
    </g>
    <text x="24" y="612" font-size="9" fill="#94a3b8">Fuente: Asamblea Legislativa</text>
  </svg>`;
  document.getElementById("lnv-stage").innerHTML=svg;
}
async function load(){
  document.getElementById("lnv-status").textContent="Actualizando datos…";
  try{
    const [ficha,votacion]=await Promise.all([getCsv(LNV_SOURCES.ficha),getCsv(LNV_SOURCES.votacion)]);
    lnvData={ficha,votacion};
    render();
    const missing=votacion.filter(r=>!LNV_COORDS[r.Nombre]).map(r=>r.Nombre);
    document.getElementById("lnv-status").textContent=missing.length
      ? `Cargados ${votacion.length} diputados · faltan coordenadas para: ${missing.join(", ")}`
      : `Cargados ${votacion.length} diputados · plantilla fija 1200×630`;
  }catch(e){console.error(e);document.getElementById("lnv-status").textContent="No fue posible cargar los datos."}
}
function downloadSvg(){
  const svg=document.getElementById("lnv-svg");
  if(!svg)return;
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:"image/svg+xml;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="votacion-la-nacion-facebook-1200x630.svg";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("lnv-refresh").addEventListener("click",load);
document.getElementById("lnv-download-svg").addEventListener("click",downloadSvg);
load();
</script>
